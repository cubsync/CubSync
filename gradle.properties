# Build configuration for CubSync.
#
# The project version lives here so that build scripts, packaging and CI all read
# a single value. See docs/VERSIONING.md for the versioning policy.

cubsync.version=0.2.0

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
