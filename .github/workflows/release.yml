name: Release

# Packaging is platform-specific: the Windows build is produced on Windows, because
# Compose Desktop cannot cross-package a jpackage image. This workflow exists so an
# installer is attached by a machine that is not the author's laptop, and so the
# version in the tag is checked against the version in the build before anything is
# published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One run per tag at a time. The two jobs below both need the release to exist before
# they can upload to it, and "does it exist" is a question whose answer changes while
# the other job is asking it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer and application image
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: The tag and the build must agree on the version
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -E '^cubsync\.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match cubsync.version=$declared"
            exit 1
          fi
          echo "ok: publishing $declared"

      - name: Test before packaging
        run: ./gradlew --no-daemon --stacktrace check

      - name: Build the installer and the application image
        # The MSI target downloads WiX on first use; the runner has network access.
        run: ./gradlew --no-daemon --stacktrace :app:desktop:packageMsi :app:desktop:createDistributable

      - name: Zip the application image
        shell: pwsh
        run: |
          $source = 'app/desktop/build/compose/binaries/main/app/CubSync'
          $target = "CubSync-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path $source -DestinationPath $target
          Write-Host "wrote $target ($((Get-Item $target).Length / 1MB) MiB)"

      - name: Upload as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: cubsync-windows
          path: |
            app/desktop/build/compose/binaries/main/msi/*.msi
            CubSync-*-windows-x64.zip
          retention-days: 30

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The notes are written before the tag is pushed, in docs/releases/<tag>.md,
          # and they are for the person who came to download something: what to take,
          # what it does, what was fixed, what to be careful about. Publishing a
          # placeholder while the real file sits in the repository is how a release page
          # ends up saying nothing.
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          # A draft, not an announcement.
          #
          # A tag here means "here is a build to look at", and the person looking at it is
          # the one who decides whether it is a release. A draft keeps the tag, keeps the
          # artefacts downloadable, and stays off the public releases list until somebody
          # publishes it — which is a decision rather than a side effect of pushing a tag.
          #
          # The guard asks the API rather than `gh release view`, because a draft is
          # invisible to the latter and a second run would try to create it again.
          # Idempotent on purpose: both jobs in this workflow need the release to exist,
          # they run at the same time, and whoever loses the race gets "already exists"
          # rather than a second release. Asking first, then tolerating the failure and
          # asking again, is what makes that a race rather than a bug — it produced two
          # drafts for v0.3.5 before it looked like this.
          ensure_release() {
            for attempt in 1 2 3 4 5; do
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
                return 0
              fi
              if [ -f "$NOTES" ]; then
                gh release create "$GITHUB_REF_NAME" \
                  --title "CubSync ${GITHUB_REF_NAME#v}" \
                  --notes-file "$NOTES" \
                  --draft 2>/dev/null && return 0
              else
                # A tag with no notes still gets a release, so the artefacts are never
                # orphaned.
                gh release create "$GITHUB_REF_NAME" \
                  --title "CubSync ${GITHUB_REF_NAME#v}" \
                  --generate-notes \
                  --draft 2>/dev/null && return 0
              fi
              sleep 3
            done
            return 1
          }
          ensure_release
          gh release upload "$GITHUB_REF_NAME" \
            app/desktop/build/compose/binaries/main/msi/*.msi \
            CubSync-*-windows-x64.zip \
            --clobber

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test before packaging
        run: ./gradlew --no-daemon --stacktrace :app:android:testDebugUnitTest

      - name: Build the APK
        run: ./gradlew --no-daemon --stacktrace :app:android:assembleDebug

      - name: Name it after the release
        run: |
          set -eu
          cp app/android/build/outputs/apk/debug/android-debug.apk \
             "CubSync-${GITHUB_REF_NAME}-debug.apk"
          ls -l CubSync-*.apk

      - name: Upload as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: cubsync-android
          path: CubSync-*-debug.apk
          retention-days: 30

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The notes are written before the tag is pushed, in docs/releases/<tag>.md,
          # and they are for the person who came to download something: what to take,
          # what it does, what was fixed, what to be careful about. Publishing a
          # placeholder while the real file sits in the repository is how a release page
          # ends up saying nothing.
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          # A draft, not an announcement.
          #
          # A tag here means "here is a build to look at", and the person looking at it is
          # the one who decides whether it is a release. A draft keeps the tag, keeps the
          # artefacts downloadable, and stays off the public releases list until somebody
          # publishes it — which is a decision rather than a side effect of pushing a tag.
          #
          # The guard asks the API rather than `gh release view`, because a draft is
          # invisible to the latter and a second run would try to create it again.
          # Idempotent on purpose: both jobs in this workflow need the release to exist,
          # they run at the same time, and whoever loses the race gets "already exists"
          # rather than a second release. Asking first, then tolerating the failure and
          # asking again, is what makes that a race rather than a bug — it produced two
          # drafts for v0.3.5 before it looked like this.
          ensure_release() {
            for attempt in 1 2 3 4 5; do
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
                return 0
              fi
              if [ -f "$NOTES" ]; then
                gh release create "$GITHUB_REF_NAME" \
                  --title "CubSync ${GITHUB_REF_NAME#v}" \
                  --notes-file "$NOTES" \
                  --draft 2>/dev/null && return 0
              else
                # A tag with no notes still gets a release, so the artefacts are never
                # orphaned.
                gh release create "$GITHUB_REF_NAME" \
                  --title "CubSync ${GITHUB_REF_NAME#v}" \
                  --generate-notes \
                  --draft 2>/dev/null && return 0
              fi
              sleep 3
            done
            return 1
          }
          ensure_release
          # The debug APK rather than a release build: a signed release needs a
          # keystore, and a keystore is a decision about distribution rather than a
          # build step. A debug APK sideloads normally in the meantime.
          gh release upload "$GITHUB_REF_NAME" CubSync-*-debug.apk --clobber
