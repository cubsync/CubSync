name: Release

# Packaging is platform-specific: the Windows build is produced on Windows, because
# Compose Desktop cannot cross-package a jpackage image. This workflow exists so an
# installer is attached by a machine that is not the author's laptop, and so the
# version in the tag is checked against the version in the build before anything is
# published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One run per tag at a time. The two jobs below both need the release to exist before
# they can upload to it, and "does it exist" is a question whose answer changes while
# the other job is asking it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer and application image
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: The tag and the build must agree on the version
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -E '^cubsync\.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match cubsync.version=$declared"
            exit 1
          fi
          echo "ok: publishing $declared"

      - name: Test before packaging
        run: ./gradlew --no-daemon --stacktrace check

      - name: Build the installer and the application image
        # The MSI target downloads WiX on first use; the runner has network access.
        run: ./gradlew --no-daemon --stacktrace :app:desktop:packageMsi :app:desktop:createDistributable

      - name: Zip the application image
        shell: pwsh
        run: |
          $source = 'app/desktop/build/compose/binaries/main/app/CubSync'
          $target = "CubSync-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path $source -DestinationPath $target
          Write-Host "wrote $target ($((Get-Item $target).Length / 1MB) MiB)"

      - name: Upload as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: cubsync-windows
          path: |
            app/desktop/build/compose/binaries/main/msi/*.msi
            CubSync-*-windows-x64.zip
          retention-days: 30

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The notes are written before the tag is pushed, in docs/releases/<tag>.md,
          # and they are for the person who came to download something: what to take,
          # what it does, what was fixed, what to be careful about. Publishing a
          # placeholder while the real file sits in the repository is how a release page
          # ends up saying nothing.
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          # A draft, not an announcement.
          #
          # A tag here means "here is a build to look at", and the person looking at it is
          # the one who decides whether it is a release. A draft keeps the tag, keeps the
          # artefacts downloadable, and stays off the public releases list until somebody
          # publishes it — which is a decision rather than a side effect of pushing a tag.
          #
          # The guard asks the API rather than `gh release view`, because a draft is
          # invisible to the latter and a second run would try to create it again.
          # Idempotent on purpose: both jobs in this workflow need the release to exist,
          # they run at the same time, and whoever loses the race gets "already exists"
          # rather than a second release. Asking first, then tolerating the failure and
          # asking again, is what makes that a race rather than a bug — it produced two
          # drafts for v0.3.5 before it looked like this.
          # `releases/tags/<tag>` does not return draft releases: for a draft that exists it
          # answers 404. That single fact explains both bugs this workflow has had — two
          # drafts for one tag (both jobs asked, both were told "no", both created one) and
          # the android job waiting five minutes for a release that was already there and
          # then failing with 404.
          #
          # The list endpoint does include drafts, so ask it instead.
          release_exists() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100"               --jq "[.[] | select(.tag_name==\"$GITHUB_REF_NAME\")] | length" 2>/dev/null               | grep -qv '^0$'
          }
          ensure_release() {
            for attempt in 1 2 3 4 5; do
              if release_exists; then
                return 0
              fi
              if [ -f "$NOTES" ]; then
                gh release create "$GITHUB_REF_NAME" \
                  --title "CubSync ${GITHUB_REF_NAME#v}" \
                  --notes-file "$NOTES" \
                  --draft 2>/dev/null && return 0
              else
                # A tag with no notes still gets a release, so the artefacts are never
                # orphaned.
                gh release create "$GITHUB_REF_NAME" \
                  --title "CubSync ${GITHUB_REF_NAME#v}" \
                  --generate-notes \
                  --draft 2>/dev/null && return 0
              fi
              sleep 3
            done
            return 1
          }
          ensure_release
          gh release upload "$GITHUB_REF_NAME" \
            app/desktop/build/compose/binaries/main/msi/*.msi \
            CubSync-*-windows-x64.zip \
            --clobber

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test before packaging
        run: ./gradlew --no-daemon --stacktrace :app:android:testDebugUnitTest

      - name: Provide the signing identity
        # The keystore is base64 inside a secret because a secret is text and a keystore
        # is binary. Decoding it here, rather than committing it, is what makes one key
        # sign every release: a runner that regenerated its own key each time is exactly
        # why the earlier APKs could not replace one another. See docs/SIGNING.md.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — falling back to the debug APK, which cannot upgrade an installed release"
            exit 0
          fi
          keystore="$RUNNER_TEMP/cubsync-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the APK
        run: |
          set -eu
          if [ -f keystore.properties ]; then
            ./gradlew --no-daemon --stacktrace :app:android:assembleRelease
            apk=$(ls app/android/build/outputs/apk/release/*.apk | head -1)
            name="CubSync-${GITHUB_REF_NAME}.apk"
          else
            ./gradlew --no-daemon --stacktrace :app:android:assembleDebug
            apk=app/android/build/outputs/apk/debug/android-debug.apk
            name="CubSync-${GITHUB_REF_NAME}-debug.apk"
          fi
          cp "$apk" "$name"
          ls -l CubSync-*.apk
          # Printed so the log says which key signed it, which is the one thing about an
          # APK that cannot be recovered from the repository afterwards.
          #
          # apksigner rather than `keytool -printcert -jarfile`: these APKs are signed
          # with the v2/v3 scheme, whose signature lives in the APK Signing Block and not
          # in the JAR signature files keytool reads. keytool therefore prints nothing at
          # all here, which looks like a pass rather than a missing check.
          if [ -f keystore.properties ]; then
            apksigner="$(ls -1 "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort | tail -1 || true)"
            if [ -n "${apksigner:-}" ]; then
              "$apksigner" verify --print-certs "$name"
            else
              echo "::warning::apksigner not found under \$ANDROID_HOME/build-tools; the certificate was not printed"
            fi
          fi

      - name: Upload as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: cubsync-android
          path: CubSync-*.apk
          retention-days: 30

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The notes are written before the tag is pushed, in docs/releases/<tag>.md,
          # and they are for the person who came to download something: what to take,
          # what it does, what was fixed, what to be careful about. Publishing a
          # placeholder while the real file sits in the repository is how a release page
          # ends up saying nothing.
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          # A draft, not an announcement.
          #
          # A tag here means "here is a build to look at", and the person looking at it is
          # the one who decides whether it is a release. A draft keeps the tag, keeps the
          # artefacts downloadable, and stays off the public releases list until somebody
          # publishes it — which is a decision rather than a side effect of pushing a tag.
          #
          # The guard asks the API rather than `gh release view`, because a draft is
          # invisible to the latter and a second run would try to create it again.
          # Only the windows job creates the release.
          #
          # A draft release is not unique per tag: GitHub allows several with the same
          # tag_name, so two jobs racing to create one produce two drafts — one holding
          # the artefacts, one holding nothing. v0.3.5 and v0.3.6 both came out that way.
          # An idempotent create cannot prevent it, because the loser does not get
          # "already exists"; it gets a second release. So this job only waits: the
          # release is created once, by the job that also builds the installer.
          for attempt in $(seq 1 20); do
            if release_exists; then
              break
            fi
            sleep 15
          done
          release_exists
          # Whichever APK the build produced: release-signed when the signing secret is
          # present, the debug one when it is not. The glob covers both.
          gh release upload "$GITHUB_REF_NAME" CubSync-*.apk --clobber
