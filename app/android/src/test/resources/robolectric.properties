# Screenshots are taken on the JVM, so the drawing has to actually happen.
#
# `graphicsMode=NATIVE` gives real pixels instead of Robolectric's no-op canvas;
# `pixelCopyRenderMode=hardware` makes the pixel copy that Compose's `captureToImage`
# performs resolve through that renderer rather than waiting for a window traversal
# that never comes; `useEmbeddedViewRoot` attaches the composition to a view root so
# there is something to draw into.
sdk=35
graphicsMode=NATIVE
pixelCopyRenderMode=hardware
useEmbeddedViewRoot=true
